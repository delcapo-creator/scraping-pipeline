[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapekit"
version = "1.0.0"
description = "A polite, validated web scraping pipeline (requests, BeautifulSoup, Playwright)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12", "lxml>=4.9"]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=7"]

[project.scripts]
scrapekit = "scrapekit.cli:main"

[tool.setuptools]
packages = ["scrapekit", "scrapekit.sites"]
